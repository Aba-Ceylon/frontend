name: SEO Check

# Guards against the failure that deindexed the whole site for ~2 months: an
# `X-Robots-Tag: noindex` header set at the hosting layer, invisible to the
# repo and to page-level HTML audits. Runs against production, not a build.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to check"
        required: false
        default: "https://www.abaceylontours.com"

jobs:
  seo-check:
    name: Production SEO smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # No install step: the script uses only Node built-ins and global fetch.
      - name: Run SEO check
        run: node scripts/seo-check.mjs "${{ github.event.inputs.base_url || 'https://www.abaceylontours.com' }}"
